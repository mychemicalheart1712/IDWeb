<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <h1>Registro de Estudiantes</h1>
        <form action="/procesar" method="POST" class="form-container">
            <fieldset>
                <legend>Información Personal</legend> 
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombres:</label>
                    <input type="text" id="nombre" name="nombre" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="apellidos" class="form-label">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="nacimiento" class="form-label">Fecha de nacimiento:</label>
                    <input type="date" id="nacimiento" name="nacimiento" class="form-input" required min="1960-01-01"  max="2010-12-31">
                </div>

                <div class="form-group">
                    <label for="egreso" class="form-label">Año de egreso:</label>
                    <input type="number" id="egreso" name="egreso" class="form-input" required min="1980"  max="2026">
                </div>

                <div class="form-group">
                    <label for="cui" class="form-label">CUI:</label>
                    <input type="text" id="cui" name="cui" class="form-input" required pattern="[0-9]{8}" title="El CUI debe tener 8 dígitos">
                </div>

            </fieldset>

            <fieldset>
                <legend>Información de la Cuenta</legend>
                <div class="form-group">
                    <label for="email" class="form-label">Correo Institucional:</label>
                    <input type="email" id="email" name="email" class="form-input"
                        required placeholder="usuario@universidad.edu.pe">
                </div>

                <div class="form-group">
                    <label for="contrasena" class="form-label">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" class="form-input" required minlength="8" 
                        pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" title="Debe tener como mínimo 8 caracteres, una mayúscula y un número" >
                </div>
            </fieldset>

            <fieldset>
                <legend>Información Académica</legend>
                <div class="form-group">
                    <label for="carrera" class="form-label">Carrera Profesional:</label>
                    <select id="carrera" name="carrera" class="form-input" required>
                        <option value="">Seleccione carrera</option>
                        <option value="sistemas">Ingeniería de Sistemas</option>
                        <option value="sanitaria">Ingeniería Sanitaria</option>
                        <option value="mecanica">Ingeniería Mecánica</option>
                        <option value="industrial">Ingeniería Industrial</option>
                        <option value="ambiental">Ingeniería Ambiental</option>
                        <option value="materiales">Ingeniería de Materiales</option>
                        <option value="quimica">Ingeniería Química</option>
                        <option value="civil">Ingeniería Civil</option>
                        <option value="minas">Ingeniería de Minas</option>
                        <option value="electrica">Ingeniería Eléctrica</option>
                        <option value="electronica">Ingeniería Electrónica</option>
                        <option value="telecomunicaciones">Ingeniería de Telecomunicaciones</option>
                    </select>
                </div>

                <div>
                    <p>Turnos:</p>
                    <input type="radio" id="manana" name="turno" value="manana" required>
                    <label for="manana">Mañana</label>
                    <input type="radio" id="tarde" name="turno" value="tarde">
                    <label for="tarde">Tarde</label>
                    <input type="radio" id="noche" name="turno" value="noche">
                    <label for="noche">Noche</label>
                </div>

                <div>
                    <input type="checkbox" id="checkbox" name="checkbox" required>
                    <label for="checkbox">Acepto los terminos y condiciones</label>
                </div>

                <div class="form-group">
                    <label for="comentarios" class="form-label">Comentarios:</label>
                    <textarea id="comentarios" name="comentarios" rows="4" class="form-input"></textarea>
                </div>
            </fieldset>

            <div>
                <button type="submit" class="btn">Registrarme</button>
                <button type="button" class="btn" disabled>Guardar borrador</button>
            </div>
            
        </form>
    </main>
    
</body>
</html>
