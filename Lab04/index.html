<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas Universitarias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="form-tareas">
        <label for="titulo">Titulo</label>
        <input type="text" id="titulo" class="form-control">
        <label for="curso">Curso</label>
        <input type="text" id="curso" class="form-control">
        <label for="fecha-entrega">Fecha de Entrega</label>
        <input type="date" id="fecha-entrega" class="form-control">
        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>

    <button type="button" id="btn-todas" class="btn btn-primary">Todas</button>
    <button type="button" id="btn-pendientes" class="btn btn-primary">Pendientes</button>
    <button type="button" id="btn-completadas" class="btn btn-primary">Completadas</button>
    <ul id="lista-tareas" class="list-group"></ul>

    <div id="alertas"></div>
    <script src="app.js"></script>
</body>

</html>
